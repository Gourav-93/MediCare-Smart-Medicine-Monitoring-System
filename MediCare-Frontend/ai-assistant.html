<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare - AI Health & Medication Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Common MediCare Design Tokens & Core Styles -->
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/ai-chatbot.css" />

    <style>
      :root {
        --primary: #0284c7;
        --primary-dark: #0369a1;
        --primary-light: #e0f2fe;
        --danger: #dc2626;
        --danger-light: #fee2e2;
        --success: #16a34a;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --bg: #f8fafc;
        --surface: #ffffff;

        --border: #e2e8f0;
        --radius: 14px;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        height: 70px;
        display: flex;
        align-items: center;
        padding: 0 clamp(16px, 4vw, 40px);
        flex-shrink: 0;
      }

      .nav-container {
        width: 100%;
        max-width: 1380px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #0284c7, #0ea5e9);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 800;
        font-size: 20px;
        box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
      }

      .brand-text h1 {
        font-size: 19px;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1.1;
      }

      .brand-text span {
        font-size: 11px;
        font-weight: 600;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .desktop-nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
        list-style: none;
      }

      .desktop-nav-links a {
        text-decoration: none;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 600;
        transition: color 0.2s;
      }
      .desktop-nav-links a.active {
        color: var(--primary);
      }

      .btn {
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        transition: all 0.2s;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-dark);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-main);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        background: #f1f5f9;
      }

      /* Mobile Controls */
      .mobile-actions {
        display: none;
        align-items: center;
        gap: 8px;
      }
      .hamburger-btn {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
      }
      .hamburger-btn span {
        width: 18px;
        height: 2px;
        background: var(--text-main);
        border-radius: 2px;
      }

      /* Mobile Drawer */
      .mobile-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(4px);
        z-index: 200;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
      }
      .mobile-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .mobile-drawer {
        position: fixed;
        top: 0;
        right: -100%;
        width: min(320px, 85vw);
        height: 100%;
        background: var(--surface);
        z-index: 201;
        padding: 20px;
        display: flex;
        flex-direction: column;
        transition: right 0.3s ease;
      }
      .mobile-drawer.active {
        right: 0;
      }

      /* =========================================================
       CHAT LAYOUT WORKSPACE
       ========================================================= */
      .chat-wrapper {
        max-width: 1080px;
        width: 100%;
        margin: 0 auto;
        padding: clamp(14px, 3vw, 24px) clamp(16px, 4vw, 40px);
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .safety-notice {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #166534;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-shrink: 0;
      }

      /* Main Chat Console Card */
      .chat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 520px;
        overflow: hidden;
      }

      .chat-top-bar {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        flex-shrink: 0;
      }
      .bot-status {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .bot-avatar {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--primary-light);
        color: var(--primary-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .bot-info h3 {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-main);
      }
      .bot-info span {
        font-size: 11.5px;
        color: var(--success);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .bot-info span::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }

      /* Messages Stream */
      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: #fafaf9;
      }

      .msg-row {
        display: flex;
        gap: 10px;
        max-width: 82%;
      }
      .msg-bot {
        align-self: flex-start;
      }
      .msg-user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .msg-bubble {
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 13.5px;
        line-height: 1.5;
      }
      .msg-bot .msg-bubble {
        background: #ffffff;
        border: 1px solid var(--border);
        color: var(--text-main);
        border-top-left-radius: 4px;
        box-shadow: var(--shadow-sm);
      }
      .msg-user .msg-bubble {
        background: var(--primary);
        color: #ffffff;
        border-top-right-radius: 4px;
      }

      .msg-time {
        font-size: 10.5px;
        color: var(--text-muted);
        margin-top: 4px;
        padding: 0 4px;
      }

      /* Quick Suggestion Pills */
      .quick-prompts {
        padding: 10px 16px;
        background: #ffffff;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        overflow-x: auto;
        white-space: nowrap;
        flex-shrink: 0;
        -webkit-overflow-scrolling: touch;
      }
      .prompt-chip {
        min-height: 44px;
        padding: 8px 16px;
        border-radius: 22px;
        background: #f1f5f9;
        color: #0f172a;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid #cbd5e1;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .prompt-chip:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
      }
      .prompt-chip:hover {
        background: var(--primary-light);
        color: var(--primary-dark);
        border-color: #bae6fd;
      }

      /* Bottom Input Bar */
      .chat-input-area {
        padding: 12px 16px;
        background: #ffffff;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        align-items: center;
        flex-shrink: 0;
      }
      .chat-text-input {
        flex: 1;
        min-height: 46px;
        padding: 11px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        background: #f8fafc;
        transition: all 0.2s;
      }
      .chat-text-input:focus-visible {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
      }

      /* =========================================================
       RESPONSIVE BREAKPOINTS (320px - 1366px+)
       ========================================================= */
      @media (max-width: 1023px) {
        .desktop-nav-links {
          display: none;
        }
        .mobile-actions {
          display: flex;
        }
      }

      @media (max-width: 767px) {
        .chat-wrapper {
          padding: 10px;
        }
        .chat-card {
          min-height: calc(100vh - 170px);
          border-radius: 10px;
        }
        .msg-row {
          max-width: 92%;
        }
        .chat-messages {
          padding: 12px;
        }
        .btn span {
          display: none;
        }
      }

      @media (max-width: 374px) {
        .brand-text h1 {
          font-size: 16px;
        }
        .brand-text span {
          display: none;
        }
        .quick-prompts {
          gap: 6px;
        }
        .prompt-chip {
          font-size: 11px;
          padding: 5px 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ================= MODULAR GLOBAL HEADER ================= -->
    <header id="global-header"></header>

    <!-- ================= CHAT WORKSPACE ================= -->
    <div class="chat-wrapper">
      <!-- Main Chat Window Card -->
      <div class="chat-card">
        <!-- Top Bar -->
        <div class="chat-top-bar">
          <div class="bot-status">
            <div class="bot-avatar">🤖</div>
            <div class="bot-info">
              <h3>AI Assistant</h3>
              <span>Online • Ready to Assist</span>
            </div>
          </div>
          <button
            class="btn btn-ghost"
            style="padding: 6px 12px; font-size: 12px"
            onclick="clearChat()"
          >
            New Chat
          </button>
        </div>

        <!-- Messages Stream -->
        <div class="chat-messages" id="messagesContainer">
          <!-- Bot Welcome Message -->
          <div class="msg-row msg-bot">
            <div>
              <div class="msg-bubble">
                Hello! I am your AI assistant. How can I help you today? Feel
                free to ask about programming, general knowledge, writing,
                education, MediCare, or any topic you would like!
              </div>
              <div class="msg-time">Just now</div>
            </div>
          </div>
        </div>

        <!-- Quick Suggestion Pills -->
        <div class="quick-prompts">
          <button
            class="prompt-chip"
            onclick="
              sendQuickPrompt('Explain dependency injection in ASP.NET Core')
            "
          >
            💻 Dependency Injection
          </button>
          <button
            class="prompt-chip"
            onclick="
              sendQuickPrompt('Write a Java program to reverse a string')
            "
          >
            ☕ Java String Reverse
          </button>
          <button
            class="prompt-chip"
            onclick="
              sendQuickPrompt('Help me improve my English communication')
            "
          >
            🗣️ English Practice
          </button>
          <button
            class="prompt-chip"
            onclick="
              sendQuickPrompt(
                'What is MediCare, and how does its medicine schedule work?',
              )
            "
          >
            🏥 What is MediCare?
          </button>
        </div>

        <!-- Bottom Input Form -->
        <form
          class="chat-input-area"
          id="chatForm"
          onsubmit="handleSend(event)"
        >
          <input
            type="text"
            id="userInput"
            class="chat-text-input"
            placeholder="Ask anything (e.g. coding, questions, ideas)..."
            autocomplete="off"
            required
          />
          <button
            type="submit"
            id="sendBtn"
            class="btn btn-primary"
            style="padding: 10px 18px"
          >
            Send <span>➤</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Shared MediCare API and Modular Navbar (Loaded before page script) -->
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
      // Chat Logic (Maps to POST /api/chat/ask; Mobile drawer managed by navbar.js)
      let pageChatHistory = [];
      let isGenerating = false;

      function getUserInputEl() {
        return document.getElementById("userInput");
      }

      function getMessagesContainer() {
        return document.getElementById("messagesContainer");
      }

      function appendMessage(text, isUser = false) {
        const chatBox = getMessagesContainer();
        if (!chatBox) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        const row = document.createElement("div");
        row.className = `msg-row ${isUser ? "msg-user" : "msg-bot"}`;

        row.innerHTML = `
        <div>
          <div class="msg-bubble">${escapeHtml(text).replace(/\n/g, "<br>")}</div>
          <div class="msg-time" style="${isUser ? "text-align: right;" : ""}">${timeStr}</div>
        </div>
      `;

        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      async function handleSend(e) {
        if (e && typeof e.preventDefault === "function") {
          e.preventDefault();
        }

        if (isGenerating) return;

        const inputEl = getUserInputEl();
        if (!inputEl) return;

        const text = (inputEl.value || "").trim();
        if (!text) return;

        inputEl.value = "";
        appendMessage(text, true);

        await requestAiReply(text);
      }

      async function sendQuickPrompt(promptText) {
        if (isGenerating) return;

        const text = (promptText || "").trim();
        if (!text) return;

        const inputEl = getUserInputEl();
        if (inputEl) inputEl.value = "";

        appendMessage(text, true);
        await requestAiReply(text);
      }

      async function requestAiReply(query) {
        if (isGenerating) return;
        isGenerating = true;

        const inputEl = getUserInputEl();
        const sendBtn = document.getElementById("sendBtn");
        if (inputEl) inputEl.disabled = true;
        if (sendBtn) sendBtn.disabled = true;

        const chatBox = getMessagesContainer();
        const typingId = "typing-" + Date.now();
        const typingRow = document.createElement("div");
        typingRow.className = "msg-row msg-bot";
        typingRow.id = typingId;
        typingRow.innerHTML = `
        <div>
          <div class="msg-bubble" style="color: var(--text-muted); font-style: italic;">
            🤖 AI is thinking...
          </div>
        </div>
      `;
        if (chatBox) {
          chatBox.appendChild(typingRow);
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        try {
          let reply = "";
          let suggestions = [];

          if (window.MediCareAPI && window.MediCareAPI.apiFetch) {
            const res = await window.MediCareAPI.apiFetch("/chat/ask", "POST", {
              message: query,
              history: pageChatHistory.slice(-10),
            });
            reply = res.reply || "No response returned from the assistant.";
            suggestions = res.quickSuggestions || [];
          } else {
            // Direct fallback if MediCareAPI helper not present
            const token =
              localStorage.getItem("medicare_jwt_token") ||
              localStorage.getItem("jwtToken") ||
              "";
            const res = await fetch("/api/chat/ask", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
              },
              body: JSON.stringify({
                message: query,
                history: pageChatHistory.slice(-10),
              }),
            });
            if (res.ok) {
              const data = await res.json();
              reply = data.reply || "No response returned from the assistant.";
              suggestions = data.quickSuggestions || [];
            } else {
              reply =
                "MediCare API connection offline. Please check backend server status.";
            }
          }

          // Remove typing indicator and append real message
          const typingEl = document.getElementById(typingId);
          if (typingEl) typingEl.remove();

          appendMessage(reply, false);

          // Record history
          pageChatHistory.push({ role: "user", content: query });
          pageChatHistory.push({ role: "model", content: reply });

          // Update Quick Suggestions if provided
          if (Array.isArray(suggestions) && suggestions.length > 0) {
            const container = document.querySelector(".quick-prompts");
            if (container) {
              container.innerHTML = suggestions
                .map(
                  (s) =>
                    `<button class="prompt-chip" onclick="sendQuickPrompt('${escapeHtml(s)}')">💡 ${escapeHtml(s)}</button>`,
                )
                .join("");
            }
          }
        } catch (err) {
          console.error("[AI Chat] Error:", err);
          const typingEl = document.getElementById(typingId);
          if (typingEl) typingEl.remove();

          appendMessage(
            `⚠️ Could not reach AI service: ${err.message || "Please check backend server"}.`,
            false,
          );
        } finally {
          isGenerating = false;
          if (inputEl) {
            inputEl.disabled = false;
            inputEl.focus();
          }
          if (sendBtn) sendBtn.disabled = false;
        }
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function clearChat() {
        if (confirm("Clear this conversation?")) {
          pageChatHistory = [];
          const chatBox = getMessagesContainer();
          if (chatBox) {
            chatBox.innerHTML = `
            <div class="msg-row msg-bot">
              <div>
                <div class="msg-bubble">Conversation cleared. Feel free to ask a new question!</div>
                <div class="msg-time">Just now</div>
              </div>
            </div>
          `;
          }
        }
      }
    </script>

    <!-- Global AI Chatbot floating widget -->
    <script src="js/ai-chatbot.js"></script>
  </body>
</html>
