<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — MediCare Smart Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .auth-viewport {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at 10% 20%, rgba(29, 78, 216, 0.05) 0%, rgba(2, 132, 199, 0.03) 90%), var(--bg-color);
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 2.5rem 2rem;
            position: relative;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .auth-brand i {
            width: 28px;
            height: 28px;
        }
        .auth-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }
        .auth-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .password-field-wrap {
            position: relative;
        }
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .password-toggle-btn:hover {
            color: var(--text-main);
        }
        .auth-footer {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
        }
        .auth-footer a {
            font-weight: 600;
        }
        .theme-float {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-viewport">
        <div class="auth-card animate-fade-in">
            <button class="nav-action-btn theme-float" onclick="toggleTheme()" title="Toggle Theme">
                <i data-lucide="moon"></i>
            </button>

            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <i data-lucide="activity"></i>
                    MediCare
                </a>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Sign in to monitor medications and health</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        class="form-control" 
                        placeholder="name@example.com" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                        <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
                    </div>
                    <div class="password-field-wrap">
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="form-control" 
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                            <i data-lucide="eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create an account</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();

        // Redirect if already logged in with valid token
        const existingToken = Auth.getToken();
        if (existingToken) {
            const role = Auth.getRole();
            if (role) {
                Auth.redirectByRole(role);
            }
        }

        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('loginPassword');
        toggleBtn.addEventListener('click', () => {
            const isPassword = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleBtn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons({ root: toggleBtn });
        });

        // Handle login submission
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('loginSubmitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                Utils.showToast('Please enter both email and password.', 'warning');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner" style="width: 18px; height: 18px; border-width: 2px;"></span> Signing in...';

                const profile = await Auth.handleLogin(email, password);
                Utils.showToast(`Welcome back, ${profile.name || 'User'}!`, 'success');

                setTimeout(() => {
                    Auth.redirectByRole(profile.role);
                }, 800);

            } catch (err) {
                console.error('Login error:', err);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In';
            }
        });
    </script>
</body>
</html>
