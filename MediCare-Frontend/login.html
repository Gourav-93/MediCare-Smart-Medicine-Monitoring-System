<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCare - Secure Portal Login & Register</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core MediCare API & Styles (Loaded early to ensure API is ready) -->
  <link rel="stylesheet" href="css/common.css" />
  <script src="js/api.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --success: #16a34a;
      --success-light: #dcfce7;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Main Auth Container */
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 4vw, 40px) 16px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      padding: clamp(24px, 5vw, 40px);
    }

    /* Tabs: Login vs Register */
    .auth-nav-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 24px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .auth-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .auth-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-align: center;
    }

    /* Alert / Notice Banner */
    .auth-notice-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 18px;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.45;
      animation: fadeIn 0.2s ease;
    }
    .auth-notice-banner.error {
      display: flex;
      background: var(--danger-light);
      border: 1px solid #f87171;
      color: #991b1b;
    }
    .auth-notice-banner.success {
      display: flex;
      background: var(--success-light);
      border: 1px solid #86efac;
      color: #166534;
    }
    .auth-notice-banner.warning {
      display: flex;
      background: var(--warning-light);
      border: 1px solid #fcd34d;
      color: #92400e;
    }
    .auth-notice-banner.info {
      display: flex;
      background: var(--primary-light);
      border: 1px solid #7dd3fc;
      color: var(--primary-dark);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Role Select Chips */
    .role-selector-wrap {
      margin-bottom: 20px;
    }
    .role-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: block;
      text-align: center;
    }
    .role-chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }
    .role-chip {
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .role-chip:hover {
      border-color: var(--primary);
      background: #f0f9ff;
    }
    .role-chip.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
      box-shadow: 0 1px 4px rgba(2, 132, 199, 0.2);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .input-password-wrap {
      position: relative;
    }
    .input-password-wrap input {
      padding-right: 42px;
    }
    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      margin-bottom: 20px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      background: var(--primary);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--primary-dark);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* Quick Demo Logins Section */
    .demo-accounts-wrap {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
    }
    .demo-accounts-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .demo-buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-demo-quick {
      padding: 8px 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .btn-demo-quick:hover {
      border-color: var(--primary);
      background: #f0f9ff;
    }
    .btn-demo-quick strong {
      color: var(--primary-dark);
      font-size: 12.5px;
    }
    .btn-demo-quick span {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: #ffffff;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 22px 18px;
        border-radius: 14px;
      }
      .role-chips, .demo-buttons-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .form-options {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }

    /* Hide 3-lines hamburger menu button & mobile drawer sidebar on Login page */
    #global-header .hamburger-btn,
    .mobile-drawer,
    .mobile-overlay {
      display: none !important;
    }

    /* =========================================================
       MATCH HEADER BUTTON SIZES (Sign In button)
       Exact same size and visual height as Overview, Features, Live Charts
       ========================================================= */
    @media (min-width: 768px) {
      #global-header .header-right-cluster {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #global-header .header-signin-btn {
        height: 32px;
        min-height: 32px;
        padding: 6px 12px;
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.5;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      #global-header .hamburger-btn,
      #global-header #menuToggle,
      .mobile-hamburger-btn {
        display: none !important;
      }
    }

    @media (max-width: 767px) {
      #global-header .header-right-cluster {
        gap: 8px;
      }

      #global-header .header-signin-btn {
        min-height: 32px;
        height: 32px;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      #global-header .hamburger-btn,
      #global-header #menuToggle,
      .mobile-hamburger-btn {
        display: none !important;
      }
    }

    @media (max-width: 360px) {
      #global-header .header-right-cluster {
        gap: 6px;
      }

      #global-header .header-signin-btn {
        min-height: 28px;
        height: 28px;
        padding: 0 9px;
        font-size: 12px;
        border-radius: 6px;
      }

      #global-header .hamburger-btn,
      #global-header #menuToggle,
      .mobile-hamburger-btn {
        display: none !important;
      }

      .btn-submit {
        padding: 10px 14px !important;
        font-size: 13.5px !important;
        min-height: 40px !important;
        border-radius: 8px !important;
      }
      .btn-demo-quick {
        padding: 8px 10px !important;
        font-size: 12px !important;
      }
      .auth-nav-tabs .tab-btn {
        padding: 8px 12px !important;
        font-size: 13px !important;
      }
    }

    /* Unconditionally hide hamburger button on login.html across all screens (desktop, laptop, tablet, mobile) */
    #global-header .hamburger-btn,
    #global-header #menuToggle,
    .mobile-hamburger-btn,
    .hamburger-btn {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <header id="global-header"></header>

  <!-- ================= AUTH WORKSPACE ================= -->
  <main class="auth-wrapper">
    <div class="auth-card">

      <!-- Interactive Alert / Notification Banner -->
      <div id="authNotice" class="auth-notice-banner" role="alert">
        <span id="authNoticeIcon">ℹ️</span>
        <span id="authNoticeText">Please sign in or create an account.</span>
      </div>

      <!-- Nav Tabs: Login vs Register -->
      <div class="auth-nav-tabs">
        <button type="button" class="tab-btn active" id="tabLogin" onclick="switchMode('login')">Sign In</button>
        <button type="button" class="tab-btn" id="tabRegister" onclick="switchMode('register')">Create Account</button>
      </div>

      <div class="auth-title" id="authHeading">Welcome back to MediCare</div>
      <div class="auth-desc" id="authSubtitle">Enter your registered email and password to continue.</div>

      <!-- Role Selection (Required on Register, optional hint on Sign In) -->
      <div class="role-selector-wrap" id="roleSelectorWrap" style="display: none;">
        <span class="role-label" id="roleSelectorLabel">I am registering as:</span>
        <div class="role-chips">
          <div class="role-chip selected" id="chipPatient" onclick="selectRole('PATIENT')">
            <span>👤</span>
            <span>Patient</span>
          </div>
          <div class="role-chip" id="chipCaregiver" onclick="selectRole('CAREGIVER')">
            <span>🛡️</span>
            <span>Caregiver</span>
          </div>
        </div>
      </div>

      <!-- Auth Form (Sign In & Register) -->
      <form id="authForm" onsubmit="handleFormSubmit(event)" novalidate>
        
        <!-- Full Name (Only on Registration) -->
        <div class="form-group" id="fullNameGroup" style="display: none;">
          <label for="fullNameInput">Full Name <span style="color: var(--danger);">*</span></label>
          <input type="text" class="form-control" id="fullNameInput" placeholder="e.g. John Doe" autocomplete="name">
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="emailInput">Email Address <span style="color: var(--danger);">*</span></label>
          <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required autocomplete="email">
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="passwordInput">Password <span style="color: var(--danger);">*</span></label>
          <div class="input-password-wrap">
            <input type="password" class="form-control" id="passwordInput" placeholder="Minimum 6 characters" required minlength="6" autocomplete="current-password">
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Phone Field (Only on Registration) -->
        <div class="form-group" id="phoneGroup" style="display: none;">
          <label for="phoneInput">Phone / Emergency Contact Number</label>
          <input type="tel" class="form-control" id="phoneInput" placeholder="+91 98765-43210" autocomplete="tel">
        </div>

        <!-- Options: Remember Me & Forgot Password (Only on Sign In) -->
        <div class="form-options" id="loginOptions">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this device</span>
          </label>
          <a href="javascript:void(0)" class="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Sign In to MediCare
        </button>
      </form>

      <!-- Quick Test Accounts (Demo Helper) -->
      <div class="demo-accounts-wrap" id="demoAccountsWrap">
        <div class="demo-accounts-header">
          <span>⚡ Quick Test Logins</span>
          <span style="font-size: 11px; text-transform: none; color: var(--text-muted);">1-Click Credentials</span>
        </div>
        <div class="demo-buttons-grid">
          <button type="button" class="btn-demo-quick" onclick="fillDemoCredentials('patient')">
            <strong>👤 Demo Patient</strong>
            <span>patient@medicare.com</span>
          </button>
          <button type="button" class="btn-demo-quick" onclick="fillDemoCredentials('caregiver')">
            <strong>🛡️ Demo Caregiver</strong>
            <span>caregiver@medicare.com</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="auth-footer">
    © 2026 MediCare Platform • Connected to ASP.NET Core Web API JWT Backend
  </footer>

  <!-- Modular Header / Drawer Utilities -->
  <script src="js/navbar.js"></script>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    let currentMode = 'login';
    let currentRole = 'PATIENT';

    // Banner message helper
    function showNotice(message, type = 'error') {
      const banner = document.getElementById('authNotice');
      const text = document.getElementById('authNoticeText');
      const icon = document.getElementById('authNoticeIcon');
      if (!banner || !text) return;

      banner.className = `auth-notice-banner ${type}`;
      text.innerText = message;

      if (type === 'error') icon.innerText = '⚠️';
      else if (type === 'success') icon.innerText = '✅';
      else if (type === 'warning') icon.innerText = '🔒';
      else icon.innerText = 'ℹ️';

      banner.style.display = 'flex';
      banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideNotice() {
      const banner = document.getElementById('authNotice');
      if (banner) banner.style.display = 'none';
    }

    // Role selection
    function selectRole(role) {
      currentRole = (role || 'PATIENT').toUpperCase();
      const chipPatient = document.getElementById('chipPatient');
      const chipCaregiver = document.getElementById('chipCaregiver');
      if (chipPatient) chipPatient.classList.toggle('selected', currentRole === 'PATIENT');
      if (chipCaregiver) chipCaregiver.classList.toggle('selected', currentRole === 'CAREGIVER');
    }

    // Tab switching (Sign In vs Create Account)
    function switchMode(mode) {
      currentMode = mode;
      const isReg = (mode === 'register');
      hideNotice();

      // Update tabs
      document.getElementById('tabLogin').classList.toggle('active', !isReg);
      document.getElementById('tabRegister').classList.toggle('active', isReg);

      // Toggle field visibility
      document.getElementById('fullNameGroup').style.display = isReg ? 'block' : 'none';
      document.getElementById('phoneGroup').style.display = isReg ? 'block' : 'none';
      document.getElementById('loginOptions').style.display = isReg ? 'none' : 'flex';
      document.getElementById('roleSelectorWrap').style.display = isReg ? 'block' : 'none';
      document.getElementById('demoAccountsWrap').style.display = isReg ? 'none' : 'block';

      // Update text & button labels
      document.getElementById('authHeading').innerText = isReg ? 'Create New Account' : 'Welcome back to MediCare';
      document.getElementById('authSubtitle').innerText = isReg
        ? 'Register as a Patient or Caregiver to access MediCare.'
        : 'Enter your registered credentials to continue.';
      document.getElementById('submitBtn').innerText = isReg ? 'Create My Account' : 'Sign In to MediCare';

      if (isReg) {
        selectRole(currentRole || 'PATIENT');
        const nameInput = document.getElementById('fullNameInput');
        if (nameInput) setTimeout(() => nameInput.focus(), 100);
      } else {
        const emailInput = document.getElementById('emailInput');
        if (emailInput && !emailInput.value) setTimeout(() => emailInput.focus(), 100);
      }
    }

    // Password visibility toggle
    function togglePasswordVisibility() {
      const pass = document.getElementById('passwordInput');
      if (!pass) return;
      pass.type = (pass.type === 'password') ? 'text' : 'password';
    }

    // Quick demo account filler
    function fillDemoCredentials(type) {
      switchMode('login');
      const emailInput = document.getElementById('emailInput');
      const passInput = document.getElementById('passwordInput');
      hideNotice();

      if (type === 'patient') {
        if (emailInput) emailInput.value = 'patient@medicare.com';
        if (passInput) passInput.value = 'Patient@123';
        selectRole('PATIENT');
        showNotice('Demo Patient credentials loaded. Click "Sign In to MediCare" to continue.', 'info');
      } else {
        if (emailInput) emailInput.value = 'caregiver@medicare.com';
        if (passInput) passInput.value = 'Caregiver@123';
        selectRole('CAREGIVER');
        showNotice('Demo Caregiver credentials loaded. Click "Sign In to MediCare" to continue.', 'info');
      }
    }

    // Forgot password handler
    async function handleForgotPassword() {
      hideNotice();
      let email = document.getElementById('emailInput').value.trim();
      if (!email) {
        email = prompt('Enter your registered email address to receive password reset instructions:');
        if (!email) return;
        email = email.trim();
      }

      try {
        if (window.MediCareAPI && window.MediCareAPI.apiFetch) {
          const res = await window.MediCareAPI.apiFetch('/auth/forgot-password', 'POST', { email });
          showNotice(res.message || 'If registered, reset instructions have been sent to your email.', 'info');
        } else {
          showNotice('Password reset request submitted. Please check your inbox.', 'info');
        }
      } catch (err) {
        showNotice('Password reset error: ' + (err.message || 'Could not process request.'), 'error');
      }
    }

    // Form submit handler (Sign In or Register)
    async function handleFormSubmit(e) {
      e.preventDefault();
      hideNotice();

      const submitBtn = document.getElementById('submitBtn');
      const emailInput = document.getElementById('emailInput');
      const passInput = document.getElementById('passwordInput');
      const nameInput = document.getElementById('fullNameInput');
      const phoneInput = document.getElementById('phoneInput');

      const email = emailInput ? emailInput.value.trim() : '';
      const password = passInput ? passInput.value : '';
      const fullName = nameInput ? nameInput.value.trim() : '';
      const phone = phoneInput ? phoneInput.value.trim() : '';

      // Client Validations
      if (!email) {
        showNotice('Please enter your email address.', 'error');
        if (emailInput) emailInput.focus();
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showNotice('Please enter a valid email address (e.g. name@example.com).', 'error');
        if (emailInput) emailInput.focus();
        return;
      }

      if (!password || password.length < 6) {
        showNotice('Password must be at least 6 characters long.', 'error');
        if (passInput) passInput.focus();
        return;
      }

      if (currentMode === 'register') {
        if (!fullName || fullName.length < 2) {
          showNotice('Please enter your full name (minimum 2 characters).', 'error');
          if (nameInput) nameInput.focus();
          return;
        }

        if (currentRole !== 'PATIENT' && currentRole !== 'CAREGIVER') {
          showNotice('Please select an account role: Patient or Caregiver.', 'error');
          return;
        }
      }

      // UI state: in-flight
      submitBtn.disabled = true;
      submitBtn.innerText = currentMode === 'login' ? 'Signing in...' : 'Creating Account...';

      try {
        let authData = null;

        if (currentMode === 'register') {
          // 1. REGISTER
          if (window.MediCareAPI && window.MediCareAPI.register) {
            authData = await window.MediCareAPI.register({
              name: fullName,
              email: email,
              password: password,
              role: currentRole,
              phoneNumber: phone || null
            });
          } else {
            // Direct fetch fallback
            const apiBase = (window.MediCareAPI && window.MediCareAPI.API_BASE_URL) || 'http://localhost:5000/api';
            const regRes = await fetch(`${apiBase}/auth/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: fullName,
                email: email,
                password: password,
                role: currentRole,
                phoneNumber: phone || null
              })
            });

            const regData = await regRes.json().catch(() => ({}));
            if (!regRes.ok) {
              const errMsg = regData.message || (regData.errors ? Object.values(regData.errors).flat().join(' ') : null) || 'Registration failed.';
              throw new Error(errMsg);
            }
            authData = regData;
          }

          // If backend returned JWT token on registration, we're done
          // If not, perform seamless auto-login
          if (!authData || !authData.token) {
            if (window.MediCareAPI && window.MediCareAPI.login) {
              authData = await window.MediCareAPI.login(email, password);
            }
          }

          showNotice('✅ Account registered successfully! Redirecting...', 'success');
        } else {
          // 2. SIGN IN
          if (window.MediCareAPI && window.MediCareAPI.login) {
            authData = await window.MediCareAPI.login(email, password);
          } else {
            const apiBase = (window.MediCareAPI && window.MediCareAPI.API_BASE_URL) || 'http://localhost:5000/api';
            const loginRes = await fetch(`${apiBase}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });

            const loginData = await loginRes.json().catch(() => ({}));
            if (!loginRes.ok) {
              const errMsg = loginData.message || (loginData.errors ? Object.values(loginData.errors).flat().join(' ') : null) || 'Invalid email or password.';
              throw new Error(errMsg);
            }
            authData = loginData;

            if (authData && authData.token) {
              localStorage.setItem('medicare_jwt_token', authData.token);
              localStorage.setItem('jwtToken', authData.token);
              localStorage.setItem('token', authData.token);
              localStorage.setItem('medicare_role', (authData.role || 'PATIENT').toUpperCase());
              localStorage.setItem('userRole', (authData.role || 'PATIENT').toUpperCase());
              localStorage.setItem('medicare_user', JSON.stringify(authData));
            }
          }

          showNotice('✅ Login successful! Redirecting...', 'success');
        }

        // Determine destination redirect
        const effectiveRole = (authData && authData.role ? authData.role : currentRole).toUpperCase();
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect');

        setTimeout(() => {
          if (redirectTarget && redirectTarget.endsWith('.html') && redirectTarget !== 'login.html') {
            window.location.href = redirectTarget;
            return;
          }

          if (effectiveRole === 'CAREGIVER') {
            window.location.href = 'caregiver-dashboard.html';
          } else if (effectiveRole === 'ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'patient-dashboard.html';
          }
        }, 500);

      } catch (err) {
        console.error('[MediCare Auth Error]:', err);
        showNotice(err.message || 'Authentication error. Please verify your credentials and try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = currentMode === 'login' ? 'Sign In to MediCare' : 'Create My Account';
      }
    }

    // Initialize query params & clear stale sessions
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode');
      const isExpired = urlParams.get('expired') === 'true';
      const isAuthRequired = urlParams.get('auth_required') === 'true';
      const redirectPage = urlParams.get('redirect');

      // If user navigated to login with expired=true or explicitly, ensure clean session
      if (isExpired) {
        if (window.MediCareAPI && window.MediCareAPI.clearAuthToken) {
          window.MediCareAPI.clearAuthToken();
        }
        showNotice('Your session has expired. Please sign in again to continue.', 'warning');
      } else if (isAuthRequired && redirectPage) {
        showNotice(`Please sign in or register to access "${redirectPage}".`, 'warning');
      }

      if (mode === 'register') {
        switchMode('register');
      } else {
        switchMode('login');
      }
    });
  </script>
</body>
</html>
