<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — MediCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand" id="brandLink">
                    <i data-lucide="activity"></i>
                    <span>MediCare</span>
                </a>
                <span class="sidebar-role-pill" id="sidebarRoleLabel">Portal</span>
            </div>

            <div class="sidebar-menu" id="sidebarMenu">
                <!-- Dynamically populated by Auth.renderSidebar -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Navbar -->
            <nav class="navbar">
                <div class="navbar-left">
                    <button class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle navigation drawer">
                        <i data-lucide="menu"></i>
                    </button>
                    <h2 class="navbar-title hide-mobile" id="navbarGreeting">MediCare Overview</h2>
                </div>

                <div class="navbar-right">
                    <a href="notifications.html" class="nav-action-btn" title="Notifications">
                        <i data-lucide="bell"></i>
                        <span class="nav-badge" id="navBadge" style="display: none;">0</span>
                    </a>

                    <div class="user-profile">
                        <div class="avatar" id="nav-initial">U</div>
                        <div class="user-info hide-mobile">
                            <span class="user-name" id="nav-username">User</span>
                            <span class="user-role" id="nav-role">Role</span>
                        </div>
                    </div>

                    <button class="nav-action-btn" onclick="logout()" title="Logout">
                        <i data-lucide="log-out"></i>
                    </button>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="page-content" id="dashboardContent">
                <!-- Header -->
                <div class="page-header">
                    <div class="page-title-group">
                        <h1 class="page-title" id="dashTitle">Health Dashboard</h1>
                        <p class="page-subtitle" id="dashSubtitle">Loading dashboard overview from server...</p>
                    </div>

                    <div class="page-actions" id="dashActions">
                        <!-- Role specific quick actions -->
                    </div>
                </div>

                <!-- Emergency Banner (shown if active emergency exists) -->
                <div id="emergencyAlertBanner" style="display: none;"></div>

                <!-- Low Stock Banner -->
                <div id="lowStockBanner" style="display: none;"></div>

                <!-- KPI Cards Grid -->
                <div class="kpi-grid" id="kpiGrid">
                    <!-- Loaded dynamically -->
                </div>

                <!-- Role Specific Views Container -->
                <div id="roleDashboardSection">
                    <!-- Dynamic Tables & Info -->
                </div>
            </div>
        </main>
    </div>

    <!-- SOS Modal for Patients -->
    <div class="modal-overlay" id="sosModal" style="display: none;">
        <div class="modal-content" style="max-width: 480px;">
            <div class="modal-header">
                <h3 class="modal-title" style="color: #dc2626; display: flex; align-items: center; gap: 0.5rem;">
                    <i data-lucide="alert-octagon"></i>
                    Trigger Emergency Alert
                </h3>
                <button type="button" class="btn-ghost" onclick="closeSosModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="font-size: 0.875rem; color: #475569; margin-bottom: 1rem;">
                    This will immediately alert all your connected caregivers and family members via in-app notification and email.
                </p>
                <div class="form-group">
                    <label class="form-label" for="sosMessage">Emergency Message</label>
                    <textarea id="sosMessage" class="form-control" rows="3" placeholder="Describe your emergency (e.g., severe dizziness, missed critical dose, difficulty breathing)...">Medical emergency! Please check on me immediately.</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeSosModal()">Cancel</button>
                <button type="button" class="btn btn-danger" id="btnSendSos" onclick="submitSosAlert()">
                    <i data-lucide="phone-call"></i>
                    Send Emergency Alert
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
