<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Intake History — MediCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="patient-dashboard.html" class="sidebar-brand" id="brandLink">
                    <i data-lucide="activity"></i>
                    <span>MediCare</span>
                </a>
                <span class="sidebar-role-pill" id="sidebarRoleLabel">Logs</span>
            </div>

            <div class="sidebar-menu" id="sidebarMenu">
                <!-- Dynamically populated -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Navbar -->
            <nav class="navbar">
                <div class="navbar-left">
                    <button class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle navigation drawer">
                        <i data-lucide="menu"></i>
                    </button>
                    <h2 class="navbar-title hide-mobile">Medication Intake Logs</h2>
                </div>

                <div class="navbar-right">
                    <button class="nav-action-btn" onclick="toggleTheme()" title="Toggle Theme">
                        <i data-lucide="moon"></i>
                    </button>

                    <a href="notifications.html" class="nav-action-btn" title="Notifications">
                        <i data-lucide="bell"></i>
                    </a>

                    <div class="user-profile" onclick="window.location.href='profile.html'">
                        <div class="avatar" id="nav-initial">U</div>
                        <div class="user-info hide-mobile">
                            <span class="user-name" id="nav-username">User</span>
                            <span class="user-role" id="nav-role">Role</span>
                        </div>
                    </div>

                    <button class="nav-action-btn" onclick="logout()" title="Logout">
                        <i data-lucide="log-out"></i>
                    </button>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <div class="page-title-group">
                        <h1 class="page-title">Medication History & Intake Records</h1>
                        <p class="page-subtitle">Track taken doses, missed occurrences, and pending medication compliance</p>
                    </div>

                    <div class="page-actions">
                        <a href="adherence.html" class="btn btn-outline">
                            <i data-lucide="trending-up"></i>
                            Adherence Analysis
                        </a>
                    </div>
                </div>

                <!-- Filters & Search Toolbar -->
                <div class="card" style="margin-bottom: 1.5rem; padding: 1.25rem;">
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;">
                        <div style="flex: 1; min-width: 250px;">
                            <input 
                                type="text" 
                                id="logSearchInput" 
                                class="form-control" 
                                placeholder="Search by medication name..." 
                                oninput="filterLogs()"
                            >
                        </div>

                        <div style="display: flex; gap: 0.75rem; align-items: center;">
                            <label class="form-label" style="margin-bottom: 0; font-size: 0.8rem; color: var(--text-muted); white-space: nowrap;">Status:</label>
                            <select id="filterStatus" class="form-select" style="width: 160px;" onchange="filterLogs()">
                                <option value="All">All Statuses</option>
                                <option value="Taken">Taken Doses</option>
                                <option value="Missed">Missed Doses</option>
                                <option value="Pending">Pending Doses</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Logs Table -->
                <div class="card animate-fade-in">
                    <div class="table-container">
                        <table id="logsTable">
                            <thead>
                                <tr>
                                    <th>Medicine Name</th>
                                    <th>Patient</th>
                                    <th>Scheduled Dose Time</th>
                                    <th>Actual Intake Time</th>
                                    <th>Recorded Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="logsTbody">
                                <tr>
                                    <td colspan="6" style="text-align: center;">Loading medication history...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/medicine-logs.js"></script>
</body>
</html>
