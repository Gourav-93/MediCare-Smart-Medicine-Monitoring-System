<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Alerts - MediCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i data-lucide="activity"></i>
                    MediCare
                </div>
            </div>
            <div class="sidebar-menu" id="sidebarMenu">
                <!-- Dynamically populated based on role -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Navbar -->
            <nav class="navbar">
                <div class="navbar-left">
                    <i data-lucide="menu" class="nav-icon" id="sidebarToggle"></i>
                    <h2 class="hide-mobile" style="font-size: 1.1rem;">Emergency System</h2>
                </div>
                <div class="navbar-right">
                    <i data-lucide="moon" class="nav-icon" onclick="toggleTheme()"></i>
                    <div class="user-profile" onclick="window.location.href='profile.html'">
                        <div class="avatar" id="nav-initial">U</div>
                    </div>
                    <i data-lucide="log-out" class="nav-icon" onclick="logout()" title="Logout"></i>
                </div>
            </nav>

            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Emergency Alerts</h1>
                    <button class="btn btn-danger emergency-pulse hide-caregiver" id="btnTriggerEmergency" onclick="triggerEmergency()">
                        <i data-lucide="alert-triangle"></i> SEND EMERGENCY ALERT
                    </button>
                </div>

                <div class="card animate-fade-in">
                    <div class="table-container">
                        <table id="emergencyTable">
                            <thead>
                                <tr>
                                    <th>Patient</th>
                                    <th>Message</th>
                                    <th>Status</th>
                                    <th>Time</th>
                                    <th class="hide-patient">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="5" style="text-align: center;">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/emergency.js"></script>
</body>
</html>
