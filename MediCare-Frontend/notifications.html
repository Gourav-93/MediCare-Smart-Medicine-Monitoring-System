<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - MediCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .notification-card {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .notification-card:last-child {
            border-bottom: none;
        }
        .notification-card.unread {
            background: rgba(37, 99, 235, 0.05);
            border-left: 4px solid var(--primary);
        }
        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(100, 116, 139, 0.1);
            color: var(--text-muted);
        }
        .notification-content {
            flex: 1;
        }
        .notification-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .notification-message {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        .notification-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i data-lucide="activity"></i>
                    MediCare
                </div>
            </div>
            <div class="sidebar-menu" id="sidebarMenu">
                <!-- Dynamically populated based on role -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Navbar -->
            <nav class="navbar">
                <div class="navbar-left">
                    <i data-lucide="menu" class="nav-icon" id="sidebarToggle"></i>
                    <h2 class="hide-mobile" style="font-size: 1.1rem;">Notifications</h2>
                </div>
                <div class="navbar-right">
                    <i data-lucide="moon" class="nav-icon" onclick="toggleTheme()"></i>
                    <div class="user-profile" onclick="window.location.href='profile.html'">
                        <div class="avatar" id="nav-initial">U</div>
                    </div>
                    <i data-lucide="log-out" class="nav-icon" onclick="logout()" title="Logout"></i>
                </div>
            </nav>

            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Notification Center</h1>
                    <button class="btn btn-outline" onclick="markAllAsRead()">
                        <i data-lucide="check-square"></i> Mark All as Read
                    </button>
                </div>

                <div class="card animate-fade-in" style="padding: 0;" id="notificationsContainer">
                    <div style="padding: 2rem; text-align: center; color: var(--text-muted);">
                        Loading...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
