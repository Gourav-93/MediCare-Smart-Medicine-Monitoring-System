<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center — MediCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .notification-card {
            display: flex;
            align-items: flex-start;
            gap: 1.15rem;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition-fast);
            cursor: pointer;
            background: var(--card-bg);
        }
        .notification-card:last-child {
            border-bottom: none;
        }
        .notification-card:hover {
            background: var(--card-bg-subtle);
        }
        .notification-card.unread {
            background: rgba(29, 78, 216, 0.04);
            border-left: 4px solid var(--primary);
        }
        .notification-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.25rem;
        }
        .notification-content {
            flex: 1;
        }
        .notification-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.25rem;
        }
        .notification-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .notification-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .notification-message {
            font-size: 0.875rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand" id="brandLink">
                    <i data-lucide="activity"></i>
                    <span>MediCare</span>
                </a>
                <span class="sidebar-role-pill" id="sidebarRoleLabel">Alerts</span>
            </div>

            <div class="sidebar-menu" id="sidebarMenu">
                <!-- Dynamically populated -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Navbar -->
            <nav class="navbar">
                <div class="navbar-left">
                    <button class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle navigation drawer">
                        <i data-lucide="menu"></i>
                    </button>
                    <h2 class="navbar-title hide-mobile">System Notifications</h2>
                </div>

                <div class="navbar-right">
                    <button class="nav-action-btn" onclick="toggleTheme()" title="Toggle Theme">
                        <i data-lucide="moon"></i>
                    </button>

                    <div class="user-profile" onclick="window.location.href='profile.html'">
                        <div class="avatar" id="nav-initial">U</div>
                        <div class="user-info hide-mobile">
                            <span class="user-name" id="nav-username">User</span>
                            <span class="user-role" id="nav-role">Role</span>
                        </div>
                    </div>

                    <button class="nav-action-btn" onclick="logout()" title="Logout">
                        <i data-lucide="log-out"></i>
                    </button>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <div class="page-title-group">
                        <h1 class="page-title">Notification Center</h1>
                        <p class="page-subtitle">Medication reminders, safety alerts, dose updates, and caregiver messages</p>
                    </div>

                    <div class="page-actions">
                        <!-- Admin broadcast button -->
                        <button class="btn btn-outline" id="btnAdminBroadcast" style="display: none;" onclick="openBroadcastModal()">
                            <i data-lucide="send"></i>
                            Send Notification
                        </button>

                        <button class="btn btn-primary" onclick="markAllNotificationsAsRead()">
                            <i data-lucide="check-check"></i>
                            Mark All as Read
                        </button>
                    </div>
                </div>

                <!-- Notifications Container -->
                <div class="card animate-fade-in" style="padding: 0; overflow: hidden;" id="notificationsContainer">
                    <div class="empty-state">
                        <div class="spinner" style="margin: 0 auto 0.75rem;"></div>
                        <div>Loading notifications...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Admin Broadcast Modal -->
    <div class="modal-overlay" id="broadcastModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <i data-lucide="broadcast"></i>
                    Create System Notification
                </div>
                <button class="modal-close" onclick="closeModal('broadcastModal')">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="broadcastForm">
                <div class="form-group">
                    <label class="form-label" for="notifUserId">Target User ID</label>
                    <input type="number" id="notifUserId" class="form-control" required placeholder="User ID">
                </div>

                <div class="form-group">
                    <label class="form-label" for="notifTitle">Title</label>
                    <input type="text" id="notifTitle" class="form-control" required placeholder="e.g. Schedule Change Notice">
                </div>

                <div class="form-group">
                    <label class="form-label" for="notifMessage">Message</label>
                    <textarea id="notifMessage" class="form-control" rows="3" required placeholder="Notification message text..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="notifType">Type</label>
                    <select id="notifType" class="form-select">
                        <option value="General" selected>General</option>
                        <option value="Reminder">Reminder</option>
                        <option value="EmergencyAlert">EmergencyAlert</option>
                        <option value="LowStock">LowStock</option>
                    </select>
                </div>

                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('broadcastModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmitBroadcast">
                        <i data-lucide="send"></i>
                        Send Notification
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
